<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="https://img2.pic.in.th/494689434680826811541356487741571349200127ncced4671567643e2.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        *, ::before, ::after {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Orbitron', sans-serif;
            color: #ffffff;
            background-color: #0b0b0b;
            background-image: url('https://img2.pic.in.th/bgbastien.jpg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* --- เอฟเฟกต์เฟดอินเปิดเว็บ --- */
        .site-wrapper {
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            width: 100%;
            height: 100%;
        }
        .site-wrapper.loaded {
            opacity: 1;
        }

        /* --- ส่วนหัวข้อด้านบน (BASTIEN & EVELYN) --- */
        .top-header-container {
            position: fixed;
            top: 33px;
            left: 55px;
            right: 55px;
            display: flex;
            align-items: center;
            z-index: 10;
        }

        .top-header-line {
            flex-grow: 1;
            height: 1px;
            background-color: rgba(255, 255, 255, 0.25);
        }

        .top-header-text {
            margin: 0 25px;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.25em;
            color: #b5b5b5;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
            white-space: nowrap;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            position: relative;
            padding: 0 20px;
            transform: translateY(-20px);
            z-index: 1;
        }

        .header-title {
            font-size: 4.6rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            margin-bottom: 0.15rem;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .header-subtitle {
            font-size: 1.3rem;
            letter-spacing: 0.3em;
            color: #b5b5b5;
            margin-bottom: 1.2rem;
            font-weight: 500;
        }

        .logo-crest {
            width: 295px;
            height: auto;
            margin-bottom: 1.2rem;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.25));
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform;
        }

        .logo-crest:hover {
            transform: scale(1.03);
        }

        .members-container {
            display: flex;
            gap: 1.5rem;
        }

        .member-box {
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.8rem 2.3rem;
            text-align: center;
            background: rgba(20, 20, 20, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 4px;
            will-change: transform, background, border-color, box-shadow;
        }

        .member-box:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
            transform: translateY(-4px);
        }

        .member-name {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.15em;
        }

        .member-role {
            font-size: 0.6rem;
            color: #999;
            letter-spacing: 0.1em;
            margin-top: 0.25rem;
            text-transform: uppercase;
        }

        /* ฟุตเตอร์ */
        .footer-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 10;
        }

        .footer-line {
            width: 60%;
            max-width: 800px;
            height: 1px;
            background-color: rgba(255, 255, 255, 0.15);
            margin-bottom: 12px;
        }

        .footer {
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 400;
        }

        .footer a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-block;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 15px rgba(255, 255, 255, 0.5);
            animation: whiteGlowPulse 2s infinite alternate;
        }

        .footer a:hover {
            text-shadow: 0 0 12px rgba(255, 255, 255, 1), 0 0 25px rgba(255, 255, 255, 0.9), 0 0 35px rgba(255, 255, 255, 0.6);
            transform: scale(1.05);
        }

        @keyframes whiteGlowPulse {
            0% {
                text-shadow: 0 0 5px rgba(255, 255, 255, 0.6), 0 0 10px rgba(255, 255, 255, 0.3);
            }
            100% {
                text-shadow: 0 0 12px rgba(255, 255, 255, 0.95), 0 0 20px rgba(255, 255, 255, 0.7);
            }
        }

        .social-buttons {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .social-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 15, 15, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 10px 16px;
            border-radius: 10px;
            color: #ccc;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, background, border-color, box-shadow;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
        }

        .social-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .social-btn:hover svg {
            transform: scale(1.1);
        }

        /* YouTube Music Player Card */
        .music-player {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 280px;
            background: rgba(15, 15, 15, 0.85);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .player-art {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }

        .player-info {
            flex-grow: 1;
            overflow: hidden;
        }

        .track-title {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 0.6rem;
            color: #aaa;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }

        .progress-container {
            width: 100%;
            height: 3px;
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
            margin-bottom: 6px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #fff;
            border-radius: 2px;
            position: relative;
            transition: width 0.1s linear;
        }

        .player-bottom-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .player-controls {
            display: flex;
            align-items: center;
            color: #ccc;
        }

        .control-btn {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            padding: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .control-btn:hover {
            color: #fff;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.6rem;
            color: #aaa;
        }

        .volume-slider {
            width: 50px;
            height: 3px;
            accent-color: #fff;
            cursor: pointer;
        }

        #youtube-player {
            display: none;
        }
    </style>
</head>
<body>

    <!-- ส่วนเนื้อหาหลัก -->
    <div class="site-wrapper" id="siteWrapper">

        <div class="top-header-container">
            <div class="top-header-line"></div>
            <div class="top-header-text">BASTIEN & EVELYN</div>
            <div class="top-header-line"></div>
        </div>

        <div class="main-content">

            <img src="https://img2.pic.in.th/1975LOGO.png" alt="1975LOGO" class="logo-crest">

                    <div class="member-name">EVELYN</div>
                    <div class="member-role">MEMBER</div>
                </div>
            </div>
        </div>

        <div class="footer-container">
            <div class="footer-line"></div>
            <div class="footer">
                &copy; 2026 BASTIEN X EVELYN. DESIGN by <a href="https://discord.gg/b9WjUu2bxd" target="blank" onclick="playClickEffect()">Turk Bastien</a>
            </div>
        </div>

        <div class="social-buttons">
            <a href="https://discord.gg/w4nTsbcCJG" target="blank" class="social-btn" title="Discord" onclick="playClickEffect()">
                <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.011c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>

        <!-- YouTube Music Player UI -->
        <div class="music-player">
            <div class="player-art" id="playerArt" style="background-image: url('https://img.youtube.com/vi/OhKAdBRLhwM/hqdefault.jpg');"></div>
            <div class="player-info">
                <div class="track-title">037</div>
                <div class="track-artist">ILLSLICK</div>
                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="player-bottom-row">
                    <div class="player-controls">
                        <button class="control-btn" id="playPauseBtn" title="Play/Pause">
                            <svg id="playIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                            <svg id="pauseIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                        </button>
                    </div>
                    <div class="volume-container">
                        <span>VOL</span>
                        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" step="1" value="50">
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- YouTube IFrame API Element -->
    <div id="youtube-player"></div>

    <script>
        const clickSound = document.getElementById('clickSound');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer');
        const volumeSlider = document.getElementById('volumeSlider');
        const siteWrapper = document.getElementById('siteWrapper');

        clickSound.volume = 0.3;

        window.addEventListener('DOMContentLoaded', () => {
            requestAnimationFrame(() => {
                siteWrapper.classList.add('loaded');
            });
        });

        function playClickEffect() {
            clickSound.currentTime = 0;
            clickSound.play().catch(e => console.log("Sound effect blocked:", e));
        }

        function goToCeoPage() {
            playClickEffect();
            setTimeout(() => {
                window.location.href = "https://1975alloriginal.xyz/ceo";
            }, 300); // หน่วงเวลาเล็กน้อยเพื่อให้เล่นเสียงคลิกทันก่อนเปลี่ยนหน้า
        }

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var progressInterval;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                videoId: 'OhKAdBRLhwM',
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'loop': 1,
                    'playlist': 'OhKAdBRLhwM'
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            event.target.setVolume(50);
            event.target.playVideo();
            startProgressLoop();
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                startProgressLoop();
            } else {
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                clearInterval(progressInterval);
            }
        }

        playPauseBtn.addEventListener('click', () => {
            playClickEffect();
            if (!player) return;
            var state = player.getPlayerState();
            if (state === YT.PlayerState.PLAYING) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        });

        document.body.addEventListener('click', function unlockAudio() {
            if (player && typeof player.playVideo === 'function') {
                player.playVideo();
            }
        }, { once: true });

        function startProgressLoop() {
            clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if (player && player.getCurrentTime && player.getDuration) {
                    const current = player.getCurrentTime();
                    const duration = player.getDuration();
                    if (duration > 0) {
                        const percent = (current / duration) * 100;
                        progressBar.style.width = percent + '%';
                    }
                }
            }, 100);
        }

        progressContainer.addEventListener('click', (e) => {
            if (!player || !player.getDuration) return;
            const rect = progressContainer.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            const duration = player.getDuration();
            const seekToTime = (clickX / width) * duration;
            player.seekTo(seekToTime, true);
        });

        volumeSlider.addEventListener('input', (e) => {
            if (player && player.setVolume) {
                player.setVolume(e.target.value);
            }
        });
    </script>
</body>
