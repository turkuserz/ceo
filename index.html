.member-box:before{content:"";position:absolute;inset:0;border-radius:6px;background:linear-gradient(135deg,rgba(255,255,255,.035),transparent 50%);opacity:0;transition:opacity .22s}
.member-box:hover{transform:translateY(-3px)!important;border-color:rgba(255,255,255,.34)!important;background:rgba(12,12,12,.74)!important;box-shadow:0 18px 36px rgba(0,0,0,.38),0 0 20px rgba(255,255,255,.045)!important}
.member-box:hover:before{opacity:1}
.member-name{position:relative;z-index:1;font-family:Orbitron,Arial,sans-serif!important;font-size:20px!important;font-weight:800!important;line-height:1!important;letter-spacing:2px!important;color:#f5f5f5!important;text-shadow:0 2px 12px rgba(255,255,255,.12)}
.member-role{position:relative;z-index:1;margin-top:7px!important;font-family:Orbitron,Arial,sans-serif!important;font-size:10px!important;font-weight:400!important;letter-spacing:1.5px!important;color:#8a8a8a!important}

/* NAVIGATION ICONS */
.nav .nav-icon{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round;opacity:.78;flex:none;transition:transform .22s ease,opacity .22s ease}
.nav a:hover .nav-icon,.nav a.active .nav-icon{opacity:1;transform:translateY(-.5px)}
.nav a span{display:inline-block}
@media(max-width:560px){.nav .nav-icon{width:11px;height:11px}.nav a{gap:6px}}
