<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BASTIEN • ADMIN</title>
<link rel="icon" type="image/png" href="./assets/logobastien.png">
<link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/premium.css"><link rel="stylesheet" href="./css/smooth.css">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#000;color:#fff;font-family:Inter,Arial,sans-serif}.page{width:min(1000px,100%);min-height:100vh;margin:auto;padding:22px 20px 70px}.nav{width:max-content;margin:0 auto 38px;padding:5px;border:1px solid rgba(255,255,255,.13);border-radius:30px;background:rgba(5,5,5,.62);backdrop-filter:blur(18px);display:flex;gap:3px}.nav a{height:36px;padding:0 19px;border-radius:22px;display:flex;align-items:center;color:#707070;text-decoration:none;font:600 9px Orbitron;letter-spacing:2px;transition:.3s}.nav a.active,.nav a:hover{color:#fff;background:rgba(255,255,255,.08)}
.head{text-align:center}.eyebrow{font:8px Orbitron;letter-spacing:4px;color:#777}.title{margin-top:11px;font:800 clamp(32px,6vw,52px) Orbitron;letter-spacing:8px}.sub{margin-top:9px;font:9px Orbitron;letter-spacing:4px;color:#555}.topbar{display:flex;justify-content:center;align-items:center;gap:8px;margin:20px 0 16px;flex-wrap:wrap}.notice{padding:10px 14px;border:1px solid rgba(255,255,255,.10);border-radius:9px;background:rgba(0,0,0,.35);color:#666;text-align:center;font:7px Orbitron;letter-spacing:1.2px}.logout{height:34px;padding:0 13px;border:1px solid rgba(255,255,255,.12);border-radius:8px;background:rgba(255,255,255,.035);color:#777;cursor:pointer;font:7px Orbitron;letter-spacing:1px;transition:.2s}.logout:hover{color:#fff;border-color:rgba(255,255,255,.25)}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:13px}.group{padding:18px;border:1px solid rgba(255,255,255,.13);border-radius:13px;background:rgba(8,8,8,.50);backdrop-filter:blur(16px);box-shadow:0 18px 50px rgba(0,0,0,.25);transition:.35s}.group:hover{border-color:rgba(255,255,255,.24);transform:translateY(-2px)}.group-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.group-name{font:700 11px Orbitron;letter-spacing:2px}.group-count{font:8px Orbitron;color:#555}.add{display:grid;grid-template-columns:1.05fr 1fr 110px auto auto;gap:7px}.add input{min-width:0;width:100%;height:37px;padding:0 11px;border:1px solid rgba(255,255,255,.12);border-radius:8px;background:rgba(0,0,0,.45);color:#fff;outline:none;font:8px Inter}.add input:focus,.add select:focus{border-color:rgba(255,255,255,.3)}.member-role-input{height:37px;width:100%;padding:0 9px;border:1px solid rgba(255,255,255,.12);border-radius:8px;background:rgba(0,0,0,.45);color:#aaa;outline:none;font:8px Orbitron;letter-spacing:1px}.member-role-input option{background:#111;color:#fff}.photo-btn{height:37px;padding:0 11px;border:1px solid rgba(255,255,255,.12);border-radius:8px;background:rgba(255,255,255,.035);color:#777;display:flex;align-items:center;justify-content:center;cursor:pointer;font:7px Orbitron;transition:.25s}.photo-btn:hover{color:#fff;border-color:rgba(255,255,255,.25)}.photo-btn input{display:none}.add button{height:37px;padding:0 13px;border:1px solid rgba(255,255,255,.18);border-radius:8px;background:rgba(255,255,255,.06);color:#fff;cursor:pointer;font:700 8px Orbitron;transition:.25s}.add button:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}.add button:disabled{opacity:.4;cursor:wait}.list{margin-top:12px;display:flex;flex-direction:column;gap:6px}.person{display:flex;align-items:center;gap:9px;min-height:39px;padding:7px 9px;border:1px solid rgba(255,255,255,.07);border-radius:8px;background:rgba(255,255,255,.025)}.person-avatar{width:28px;height:28px;flex:none;border-radius:7px;object-fit:cover;border:1px solid rgba(255,255,255,.14);background:#080808}.person-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px;font-weight:600}.person-role{font:7px Orbitron;color:#555;letter-spacing:1px}.mini-link,.remove{width:25px;height:25px;border:1px solid rgba(255,255,255,.08);border-radius:6px;background:transparent;color:#555;cursor:pointer;transition:.2s;text-decoration:none;display:grid;place-items:center;font-size:10px}.mini-link:hover,.remove:hover{color:#fff;border-color:rgba(255,255,255,.25)}.empty{padding:12px 4px;text-align:center;color:#444;font:7px Orbitron;letter-spacing:2px}.actions{display:flex;justify-content:center;gap:8px;margin-top:20px}.action{height:37px;padding:0 17px;border:1px solid rgba(255,255,255,.13);border-radius:8px;background:rgba(0,0,0,.4);color:#777;font:8px Orbitron;cursor:pointer;transition:.25s}.action:hover{color:#fff;border-color:rgba(255,255,255,.28)}.action:disabled{opacity:.4;cursor:wait}.state{min-height:17px;text-align:center;color:#555;font:7px Orbitron;letter-spacing:1.5px;margin-top:10px}.denied{display:none;min-height:55vh;place-items:center;text-align:center}.denied.show{display:grid}.denied-box{padding:28px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(0,0,0,.5)}.denied-title{font:800 18px Orbitron;letter-spacing:3px}.denied-sub{margin-top:10px;color:#555;font:7px Orbitron;letter-spacing:1px}
@media(max-width:700px){.groups{grid-template-columns:1fr}.add{grid-template-columns:1fr 1fr}.member-role-input{width:100%}.add button,.photo-btn{width:100%}.page{padding:16px 12px 55px}.nav a{padding:0 12px;font-size:8px}.group{padding:15px}}
</style>
<link rel="stylesheet" href="./css/global.css">
</head>
<body>
<main class="page" id="panel" style="display:none">
<nav class="nav"><a href="./index.html">⌂ HOME</a><a href="./members.html">♙ MEMBERS</a><a class="active" href="./admin.html">♙ ADMIN</a></nav>
<header class="head"><div class="eyebrow">CONTROL PANEL</div><div class="title">ADMIN</div><div class="sub">BASTIEN • FEARLESS</div></header>
<div class="topbar"><div class="notice">KEYAUTH • SECURE ADMIN ACCESS</div><button class="logout" id="logout">LOGOUT</button></div>
<section class="groups" id="groups"></section><div class="state" id="state">LOADING DATABASE...</div>
<div class="actions"><button class="action" id="clearAll" type="button">CLEAR ALL MEMBERS</button></div>
</main>
<div class="denied show" id="denied"><div class="denied-box"><div class="denied-title" id="deniedTitle">CHECKING ACCESS</div><div class="denied-sub" id="deniedSub">CONNECTING TO FIREBASE...</div></div></div>
<script type="module">
import { checkKeyAuthSession, logoutKeyAuth, getKeyAuthUser } from './js/keyauth-login.js';
import { watchMembers, addMember, deleteMember, clearMembers } from './js/firebase-members.js';
import { GROUPS } from './js/firebase-config.js';

const panel=document.getElementById('panel'), denied=document.getElementById('denied'), deniedTitle=document.getElementById('deniedTitle'), deniedSub=document.getElementById('deniedSub'), groupsEl=document.getElementById('groups'), state=document.getElementById('state');
const clearBtn=document.getElementById('clearAll'); const logoutBtn=document.getElementById('logout');
let data={}; let ready=false;
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

(async()=>{
  const ok = await checkKeyAuthSession();
  if(!ok){
    panel.style.display='none';
    denied.classList.add('show');
    deniedTitle.textContent='LOGIN REQUIRED';
    deniedSub.textContent='REDIRECTING TO KEYAUTH LOGIN...';
    setTimeout(()=>location.replace('./login.html'),500);
    return;
  }
  const account = getKeyAuthUser();
  denied.classList.remove('show');
  panel.style.display='block';
  const notice = document.querySelector('.notice');
  if(notice && account?.username) notice.textContent='KEYAUTH • '+account.username.toUpperCase()+' • FIREBASE DATABASE';
  watchMembers(next=>{data=next;ready=true;state.textContent='LIVE • DATABASE CONNECTED';render();},err=>{state.textContent='DATABASE ERROR: '+(err?.message||'UNKNOWN');});
})();

function compressImage(file){
  return new Promise((resolve,reject)=>{
    if(!file){resolve('');return;}
    if(file.size>8*1024*1024){reject(new Error('รูปใหญ่เกิน 8MB'));return;}
    const img=new Image(); const reader=new FileReader();
    reader.onload=()=>{img.onload=()=>{const max=420;const scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/webp',.76));};img.onerror=()=>reject(new Error('อ่านรูปไม่ได้'));img.src=reader.result;};reader.onerror=()=>reject(new Error('อ่านไฟล์ไม่ได้'));reader.readAsDataURL(file);
  });
}

function render(){
  groupsEl.innerHTML='';
  GROUPS.forEach(group=>{
    const list=Array.isArray(data[group])?data[group]:[];
    const box=document.createElement('div');box.className='group';
    box.innerHTML=`<div class="group-head"><div class="group-name">${group}</div><div class="group-count">(${String(list.length).padStart(2,'0')})</div></div><form class="add"><input class="member-name-input" maxlength="40" placeholder="Member name..." autocomplete="off" required><input class="member-facebook-input" type="url" placeholder="Facebook link..." autocomplete="off"><select class="member-role-input" aria-label="Role"><option value="MEMBER">MEMBER</option><option value="LEADER">LEADER</option></select><label class="photo-btn"> <input class="member-photo-input" type="file" accept="image/png,image/jpeg,image/webp"> PHOTO </label><button type="submit">ADD</button></form><div class="list"></div>`;
    const listEl=box.querySelector('.list');
    if(!list.length) listEl.innerHTML='<div class="empty">NO MEMBERS YET</div>';
    list.forEach(person=>{
      const row=document.createElement('div');row.className='person';
      row.innerHTML=`<img class="person-avatar" src="${person.photo||'./assets/logobastien.png'}" alt=""><div class="person-name">${esc(person.name)}</div><div class="person-role">${esc(person.role||'MEMBER')}</div>${person.facebook?`<a class="mini-link" target="_blank" rel="noopener" href="${esc(person.facebook)}">f</a>`:''}<button class="remove" type="button">×</button>`;
      row.querySelector('.remove').onclick=async()=>{try{state.textContent='SAVING...';await deleteMember(group,person.id);state.textContent='LIVE • DATABASE CONNECTED';}catch(e){state.textContent='SAVE ERROR: '+e.message;}};
      listEl.appendChild(row);
    });
    box.querySelector('form').onsubmit=async e=>{
      e.preventDefault(); const form=e.currentTarget; const name=form.querySelector('.member-name-input').value.trim(); const facebook=form.querySelector('.member-facebook-input').value.trim(); const role=form.querySelector('.member-role-input').value; const photoFile=form.querySelector('.member-photo-input').files[0]; const submit=form.querySelector('button');
      if(!name)return; if(list.some(x=>String(x.name).toLowerCase()===name.toLowerCase())){state.textContent='ชื่อนี้มีอยู่แล้วในกลุ่ม '+group;return;}
      submit.disabled=true; state.textContent='UPLOADING MEMBER...';
      try{const photo=await compressImage(photoFile);await addMember(group,{name,facebook,photo,role:role});form.reset();state.textContent='SAVED • LIVE SYNC';}catch(err){state.textContent='SAVE ERROR: '+err.message;}finally{submit.disabled=false;}
    };
    groupsEl.appendChild(box);
  });
}

clearBtn.onclick=async()=>{if(!ready||!confirm('ลบสมาชิกทั้งหมดจากทุกกลุ่มใน Firebase ใช่ไหม?'))return;clearBtn.disabled=true;state.textContent='CLEARING DATABASE...';try{await clearMembers();state.textContent='ALL MEMBERS CLEARED';}catch(e){state.textContent='CLEAR ERROR: '+e.message;}finally{clearBtn.disabled=false;}};
logoutBtn.onclick=async()=>{await logoutKeyAuth();location.replace('./login.html');};
</script>
<script src="./js/music.js" defer></script>
<script src="./js/transition.js" defer></script>
<script>window.addEventListener("error",()=>{const t=document.getElementById("deniedTitle"),s=document.getElementById("deniedSub");if(t&&s){t.textContent="OPEN VIA LOCAL SERVER";s.textContent="DOUBLE-CLICKING HTML WILL NOT LOAD FIREBASE AUTH. USE START.BAT.";}});window.addEventListener("unhandledrejection",()=>{const t=document.getElementById("deniedTitle"),s=document.getElementById("deniedSub");if(t&&s){t.textContent="FIREBASE CONNECTION ERROR";s.textContent="CHECK FIREBASE AUTH OR OPEN THIS SITE THROUGH A LOCAL SERVER.";}});</script>
</body>
</html>
