<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BASTIEN</title>
<link rel="icon" type="image/png" href="./assets/logobastien.png">
<link rel="stylesheet" href="./css/style.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap');
:root{--white:#fff;--soft:rgba(255,255,255,.68);--muted:rgba(255,255,255,.38);--line:rgba(255,255,255,.14);--glass:rgba(5,5,5,.46)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:#000;color:#fff;font-family:Orbitron,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;background:url("./assets/Bastienstyle.png") center/cover no-repeat;filter:grayscale(1) contrast(1.06);z-index:-5;transform:scale(1.045);animation:bgMove 24s ease-in-out infinite alternate}
body:after{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,.72)),radial-gradient(circle at 50% 35%,transparent 0,rgba(0,0,0,.38) 72%);z-index:-4;pointer-events:none}
.roster-wrap{width:min(1040px,100%);min-height:100vh;margin:auto;padding:22px 20px 90px}
.nav{width:max-content;margin:0 auto 40px;padding:5px;border:1px solid rgba(255,255,255,.13);border-radius:30px;background:rgba(5,5,5,.62);box-shadow:0 16px 45px rgba(0,0,0,.4);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;gap:3px;animation:fadeDown .7s both}
.nav a{height:36px;padding:0 19px;border-radius:22px;display:flex;align-items:center;gap:7px;color:#707070;text-decoration:none;font-size:9px;font-weight:600;letter-spacing:2px;transition:.28s cubic-bezier(.22,1,.36,1)}
.nav a.active,.nav a:hover{color:#fff;background:rgba(255,255,255,.085);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.head{text-align:center;animation:heroIn .9s .08s both}
.eyebrow{font-size:8px;letter-spacing:4px;color:#777;margin-bottom:11px}.title{font-size:clamp(32px,5vw,52px);font-weight:900;letter-spacing:9px;text-shadow:0 6px 25px #000}.sub{font-size:9px;letter-spacing:4px;color:rgba(255,255,255,.48);margin-top:9px}
.tools{margin:30px auto 26px;max-width:980px;display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;animation:heroIn .8s .16s both}
.search{width:min(330px,100%);height:39px;padding:0 15px;border:1px solid var(--line);border-radius:9px;outline:0;color:#fff;background:rgba(5,5,5,.5);font:9px Orbitron;letter-spacing:1px;backdrop-filter:blur(15px);transition:.25s}
.search:focus{border-color:rgba(255,255,255,.34);box-shadow:0 0 0 3px rgba(255,255,255,.025)}.search::placeholder{color:#626262}
.filter{height:39px;min-width:112px;padding:0 14px;border:1px solid var(--line);border-radius:9px;color:#666;background:rgba(5,5,5,.5);font:8px Orbitron;letter-spacing:1.5px;cursor:pointer;backdrop-filter:blur(15px);transition:.25s}
.filter:hover,.filter.active{color:#fff;border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.07)}
.section{margin-top:22px}.section-head{display:flex;align-items:center;gap:12px;margin:0 0 13px;color:rgba(255,255,255,.68);font-size:9px;font-weight:600;letter-spacing:3px}.section-head:before,.section-head:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,rgba(255,255,255,.13))}.section-head:after{transform:scaleX(-1)}.section-head span{font-size:7px;color:#555;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.card{position:relative;min-height:91px;display:flex;align-items:center;gap:13px;padding:13px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:linear-gradient(135deg,rgba(28,28,28,.66),rgba(5,5,5,.52));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 14px 35px rgba(0,0,0,.27);overflow:hidden;animation:cardIn .55s cubic-bezier(.22,1,.36,1) both;transition:transform .3s cubic-bezier(.22,1,.36,1),border-color .3s,background .3s,box-shadow .3s}
.card:before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,255,255,.055),transparent 42%);opacity:0;transition:.3s}.card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.28);background:linear-gradient(135deg,rgba(38,38,38,.72),rgba(7,7,7,.58));box-shadow:0 20px 48px rgba(0,0,0,.4)}.card:hover:before{opacity:1}
.avatar{position:relative;z-index:1;flex:none;width:57px;height:57px;border:1px solid rgba(255,255,255,.2);border-radius:12px;overflow:hidden;background:rgba(0,0,0,.55);box-shadow:inset 0 0 20px rgba(255,255,255,.03)}
.avatar img{width:100%;height:100%;object-fit:contain;padding:5px;filter:drop-shadow(0 0 9px rgba(255,255,255,.12));transition:transform .35s cubic-bezier(.22,1,.36,1)}.card:hover .avatar img{transform:scale(1.06)}
.online{position:absolute;right:2px;bottom:2px;width:8px;height:8px;border-radius:50%;background:#eee;border:2px solid #111;box-shadow:0 0 8px rgba(255,255,255,.4)}
.info{position:relative;z-index:1;min-width:0;flex:1}.name{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.role{display:inline-block;margin-top:8px;padding:3px 7px;border:1px solid rgba(255,255,255,.16);border-radius:5px;color:#888;font-size:7px;letter-spacing:1.2px}
.social{position:relative;z-index:1;text-decoration:none;width:29px;height:29px;flex:none;display:grid;place-items:center;border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#777;background:rgba(255,255,255,.025);font-size:10px;transition:.25s}.card:hover .social{color:#fff;border-color:rgba(255,255,255,.24)}
.empty{display:none;text-align:center;padding:35px;color:#555;font-size:8px;letter-spacing:3px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.35)}
.back-row{text-align:center;margin-top:34px}.back{color:#666;text-decoration:none;font-size:8px;letter-spacing:2px;transition:.2s}.back:hover{color:#fff}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}@keyframes heroIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}@keyframes bgMove{from{transform:scale(1.045)}to{transform:scale(1.045)}}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
.filter{white-space:nowrap}.tools{row-gap:8px}
@media(max-width:560px){.roster-wrap{padding:16px 12px 65px}.nav{margin-bottom:28px}.title{letter-spacing:6px}.tools{margin-top:22px}.grid{grid-template-columns:1fr}.card{min-height:82px}.section{margin-top:18px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.rank-mark{position:absolute;right:10px;top:9px;color:rgba(255,255,255,.34);font-size:10px;z-index:2;opacity:0;transform:translateY(3px);transition:.3s var(--b-ease)}.card:hover .rank-mark{opacity:1;transform:none;color:rgba(255,255,255,.65)}

/* ULTRA SMOOTH */
html{scroll-behavior:smooth}
body{will-change:auto;backface-visibility:hidden}
.roster-bg{will-change:transform}
.card{will-change:transform,opacity}
.filter,.search{will-change:transform}
.filter:hover{transform:translateY(-2px)}
.tools{transition:transform .45s cubic-bezier(.22,1,.36,1),opacity .45s ease}
.section{animation:sectionIn .8s cubic-bezier(.22,1,.36,1) both}
@keyframes sectionIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  .roster-bg,.card,.section{animation:none!important}
}

/* STABLE SLICK OVERRIDE */
.home-bg,.roster-bg{
  animation:none!important;
  will-change:auto!important;
  transform:translateZ(0) scale(1.035)!important;
}


/* FINAL MEMBERS UX */
.tools{display:block;max-width:980px;margin:26px auto 30px}
.search-wrap{position:relative;max-width:460px;margin:0 auto 10px}
.search-wrap .search{width:100%;padding-left:38px}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);z-index:2;color:#777;font:12px Arial;pointer-events:none}
.category-bar{display:flex;justify-content:center;gap:7px;overflow-x:auto;padding:2px 2px 5px;scrollbar-width:none}
.category-bar::-webkit-scrollbar{display:none}
.filter{min-width:auto!important;padding:0 15px!important}
.section{scroll-margin-top:25px}
</style>
<link rel="stylesheet" href="./css/premium.css">
<link rel="stylesheet" href="./css/smooth.css">
<link rel="stylesheet" href="./css/global.css">

<style>
/* MEMBER DIRECTORY — SEARCH + CATEGORY BAR */
.tools{display:flex;flex-direction:column;align-items:stretch;gap:10px;width:min(980px,100%);margin:28px auto 30px}
.search-wrap{position:relative;width:100%}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);z-index:2;color:#666;font-size:15px;line-height:1;pointer-events:none}
.search{width:100%!important;height:43px!important;padding:0 15px 0 38px!important;border-radius:8px!important;background:rgba(5,5,5,.62)!important;border-color:rgba(255,255,255,.13)!important;letter-spacing:1.7px!important}
.category-bar{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;padding:4px}
.filter{height:36px!important;min-width:112px;padding:0 16px!important;border-radius:7px!important;background:rgba(5,5,5,.58)!important;border:1px solid rgba(255,255,255,.12)!important;color:#666!important;letter-spacing:1.5px!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.012)}
.filter:hover,.filter.active{color:#fff!important;border-color:rgba(255,255,255,.28)!important;background:rgba(255,255,255,.075)!important;box-shadow:0 7px 20px rgba(0,0,0,.2),inset 0 0 0 1px rgba(255,255,255,.03)}
.section{margin-top:28px}
.section-head{margin-bottom:14px}
.card .role{color:#888}
@media(max-width:560px){.tools{margin-top:21px;margin-bottom:24px}.category-bar{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;padding:3px 1px 6px;scrollbar-width:none}.category-bar::-webkit-scrollbar{display:none}.filter{flex:0 0 auto;min-width:auto}.search{height:41px!important}.section{margin-top:21px}}

/* NAVIGATION ICONS */
.nav .nav-icon{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round;opacity:.78;flex:none;transition:transform .22s ease,opacity .22s ease}
.nav a:hover .nav-icon,.nav a.active .nav-icon{opacity:1;transform:translateY(-.5px)}
.nav a span{display:inline-block}
@media(max-width:560px){.nav .nav-icon{width:11px;height:11px}.nav a{gap:6px}}
</style>
</head>
<body>
<div class="roster-bg"></div><div class="roster-shade"></div>
<main class="roster-wrap">
  <nav class="nav" aria-label="Primary navigation">
  <a href="/" aria-label="Home"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5M9 21v-6h6v6"/></svg><span>HOME</span></a>
  <a class="active" href="/members" aria-label="Members"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="10" r="2.5"/><path d="M3.5 20c.4-3.3 2.2-5 5.5-5s5.1 1.7 5.5 5M14 15.5c2.9-.4 5 .9 6 4.5"/></svg><span>MEMBER</span></a>
  <a href="/login" aria-label="Admin"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15" r="1"/></svg><span>ADMIN</span></a>
</nav>
  <header class="head" page-stagger>
    <div class="eyebrow">MEMBER DIRECTORY</div>
    <div class="title">BASTIEN</div>
    <div class="sub">BET FEARLESS IS KING</div>
  </header>

  <div class="tools">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input id="search" class="search" type="search" placeholder="SEARCH MEMBERS..." autocomplete="off">
    </div>
    <div class="category-bar" aria-label="Member categories">
      <button class="filter active" data-filter="ALL" type="button">ALL</button>
      <button class="filter" data-filter="BASTIEN" type="button">BASTIEN</button>
      <button class="filter" data-filter="EVELYN" type="button">EVELYN</button>
      <button class="filter" data-filter="STANNOWAYHOME" type="button">STANNOWAYHOME</button>
      <button class="filter" data-filter="JOPNOK" type="button">JOPNOK</button>
      <button class="filter" data-filter="ASSASSIN" type="button">ASSASSIN</button>
    </div>
  </div>

  <section class="section leaders">
    <h2 class="section-head">LEADERS <span>(00)</span></h2>
    <div class="grid" id="leadersGrid"></div>
  </section>

  <section class="section" page-stagger>
    <h2 class="section-head">MEMBERS <span id="memberCount">(00)</span></h2>
    <div class="grid" id="membersGrid"></div>
    <div class="empty" id="empty">NO MEMBERS FOUND</div>
  </section>
</main>

<script type="module">
import { watchMembers } from './js/firebase-members.js';
import { groupProfile } from './js/group-assets.js';
import { GROUPS } from './js/firebase-config.js';

const search=document.getElementById('search');
const lg=document.getElementById('leadersGrid');
const mg=document.getElementById('membersGrid');
const empty=document.getElementById('empty');
const count=document.getElementById('memberCount');
const leaderSection=document.querySelector('.leaders');
let activeGroup='ALL';
let data=Object.fromEntries(GROUPS.map(g=>[g,[]]));

function safeText(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeUrl(v){try{const u=new URL(String(v));return ['http:','https:'].includes(u.protocol)?u.href:'';}catch{return '';}}
function isLeader(person){return String(person.role||'MEMBER').trim().toUpperCase()==='LEADER';}
function card(person,index){
  const d=document.createElement('div'); d.className='card'; d.style.animationDelay=(index*45)+'ms';
  const photo=person.photo||groupProfile(person.group||activeGroup); const fb=safeUrl(person.facebook||'');
  d.innerHTML='<div class="rank-mark">'+(isLeader(person)?'♕':'')+'</div><div class="avatar"><img src="'+safeText(photo)+'" alt=""><span class="online"></span></div><div class="info"><div class="name">'+safeText(person.name)+'</div><span class="role">'+safeText((person.role||'MEMBER').toUpperCase())+'</span></div>'+(fb?'<a class="social" href="'+safeText(fb)+'" target="_blank" rel="noopener" title="Facebook">f</a>':'<div class="social">f</div>');
  return d;
}
function render(){
  const list = activeGroup==='ALL'
    ? GROUPS.flatMap(group => (Array.isArray(data[group]) ? data[group] : []).map(person => ({...person, group})))
    : (Array.isArray(data[activeGroup]) ? data[activeGroup].map(person => ({...person, group: activeGroup})) : []);
  const term=search.value.toLowerCase().trim();
  const visible=list.filter(x=>!term||String(x.name).toLowerCase().includes(term));
  const leaders=visible.filter(isLeader);
  const members=visible.filter(x=>!isLeader(x));
  lg.innerHTML=''; mg.innerHTML='';
  leaders.forEach((x,i)=>lg.appendChild(card(x,i)));
  members.forEach((x,i)=>mg.appendChild(card(x,i)));
  leaderSection.style.display=leaders.length?'block':'none';
  empty.style.display=members.length?'none':'block';
  count.textContent='('+String(members.length).padStart(2,'0')+')';
  const leaderCount=leaderSection.querySelector('.section-head span');
  leaderCount.textContent='('+String(leaders.length).padStart(2,'0')+')';
}
document.querySelectorAll('.filter').forEach(btn=>btn.addEventListener('click',()=>{
  activeGroup=btn.dataset.filter;
  document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active');
  search.value='';
  render();
}));
search.addEventListener('input',render);
const params=new URLSearchParams(location.search);
const requested=(params.get('supervised')||params.get('member')||'').toUpperCase();
if(GROUPS.includes(requested)){
  activeGroup=requested;
  document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.dataset.filter===activeGroup));
}
watchMembers(next=>{data=next;render();},()=>{
  empty.style.display='block';
  empty.textContent='DATABASE CONNECTION ERROR';
});
</script>

<script src="./js/music.js" defer></script>

<script src="./js/transition.js" defer></script>
</body>
</html>
