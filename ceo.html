    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Orbitron', sans-serif;
            color: #ffffff;
            background-color: #0b0b0b;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* --- ภาพพื้นหลัง Theme --- */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('https://img2.pic.in.th/images/allbg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(0.2) contrast(1.2) saturate(1.1);
            z-index: -999;
            transform: translateZ(0);
        }

        /* --- เอฟเฟกต์แสงสีขาวบางๆ และกลุ่มดาวเคลื่อนไหว --- */
        .nebula-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 30% 40%, rgba(255, 255, 255, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 70% 70%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
            z-index: -998;
            pointer-events: none;
            animation: nebulaPulse 8s infinite alternate ease-in-out;
        }

        @keyframes nebulaPulse {
            0% { opacity: 0.6; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -997;
            pointer-events: none;
            background-image: 
                radial-gradient(1.5px 1.5px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 50px 160px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 160px 120px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.4;
            animation: starsTwinkle 4s infinite alternate ease-in-out;
        }

        @keyframes starsTwinkle {
            0% { opacity: 0.3; transform: translateY(0px); }
            100% { opacity: 0.7; transform: translateY(-10px); }
        }

        .grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAMAAAD04JH5AAAAGXRFWHRTb2Z0d2FyZQBBZG9iZSBJbWFnZVJlYWR5ccllPAAAAyhpVFh0WE1MOmNvbS5hZG9iZS54bXAAAAAAADw/eHBhY2tldCBiZWgiZD0i77u/IiBpZD0iVzVNME1wQ2VoaUh6cmVTek5UY3prYzlkIj8+/PiYh4EAAAAAJcEhZcwAAFcEAABXBAYWuGLOAAAAYUlEQVR42u3QwxUAIAwEwXD/dO8cQ2O/xWw5mQO4/jLd9s1P7Zuf2rf9q3/bt/23f9u3/bt/23f9u3/bt/3f7P4CDAB761dPAAAAAElFTkSuQmCC');
            opacity: 0.06;
            z-index: -996;
            pointer-events: none;
        }

        .site-wrapper {
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            width: 100%;
            height: 100%;
            position: relative;
        }
        .site-wrapper.loaded {
            opacity: 1;
        }

        /* --- Header Top --- */
        .top-header {
            position: absolute;
            top: 40px;
            left: 60px;
            z-index: 10;
        }

        .title-wrapper {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .leader-title {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 0.15em;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
            background: linear-gradient(180deg, #ffffff 0%, #aaaaaa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .crown-icon {
            width: 38px;
            height: 38px;
            fill: #ffd700;
            filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.6));
            animation: crownPulse 2s infinite ease-in-out;
        }

        @keyframes crownPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 18px rgba(255, 215, 0, 0.8)); }
        }

        .leader-count {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            color: #888;
            margin-top: 5px;
            text-transform: uppercase;
        }
        .leader-count span {
            color: #fff;
            font-size: 1.5rem;
            margin-right: 5px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 20px;
            border-radius: 6px;
            color: #ccc;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            margin-top: 15px;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        /* --- Carousel Container --- */
        .carousel-section {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            position: relative;
            overflow: hidden;
        }

        .carousel-track {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            height: 520px;
        }

        /* --- Full Card Design --- */
        .leader-card {
            position: absolute;
            width: 230px;
            height: 375px;
            background: linear-gradient(135deg, rgba(20,20,20,0.95), rgba(5,5,5,0.98));
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 20px 45px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,255,255,0.1);
            cursor: pointer;
            will-change: transform, opacity;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), 
                        opacity 0.5s cubic-bezier(0.5, 0, 0, 1), 
                        background 0.5s ease, 
                        border-color 0.5s ease, 
                        box-shadow 0.5s ease;
            text-decoration: none;
            user-select: none;
            overflow: hidden;
        }

        .leader-card:hover {
            border-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.4);
        }

        .leader-card.active {
            transform: translate3d(0, -15px, 100px) rotate(0deg) scale(1.15);
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 60px rgba(255, 255, 255, 0.25), inset 0 0 20px rgba(255, 255, 255, 0.15);
            z-index: 10;
            background: linear-gradient(135deg, rgba(40,40,40,0.98), rgba(10,10,10,0.99));
            opacity: 1;
        }

        .leader-card.prev-1 { transform: translate3d(-175px, 15px, 60px) rotate(-7deg) scale(0.98); z-index: 8; opacity: 0.9; }
        .leader-card.prev-2 { transform: translate3d(-340px, 42px, 20px) rotate(-14deg) scale(0.88); z-index: 6; opacity: 0.75; }
        .leader-card.prev-3 { transform: translate3d(-495px, 80px, -20px) rotate(-21deg) scale(0.78); z-index: 4; opacity: 0.6; }

        .leader-card.next-1 { transform: translate3d(175px, 15px, 60px) rotate(7deg) scale(0.98); z-index: 8; opacity: 0.9; }
        .leader-card.next-2 { transform: translate3d(340px, 42px, 20px) rotate(14deg) scale(0.88); z-index: 6; opacity: 0.75; }
        .leader-card.next-3 { transform: translate3d(495px, 80px, -20px) rotate(21deg) scale(0.78); z-index: 4; opacity: 0.6; }

        .leader-card.hidden {
            transform: translate3d(0, 180px, -150px) rotate(0deg) scale(0.4);
            opacity: 0;
            pointer-events: none;
            z-index: 1;
        }

        .card-img-container {
            width: 100%;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: transparent;
        }

        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6));
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .leader-card:hover .card-img-container img {
            transform: scale(1.08);
        }

        .card-info-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-top: 4px;
        }

        .card-name {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 8px rgba(255,255,255,0.5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            margin-bottom: 8px;
        }

        .card-social-icon {
            width: 24px;
            height: 24px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .leader-card.active .card-social-icon {
            background: #fff;
            border-color: #fff;
            box-shadow: 0 0 10px rgba(255,255,255,0.6);
        }
        .card-social-icon svg {
            width: 12px;
            height: 12px;
            fill: #ffffff;
        }
        .leader-card.active .card-social-icon svg {
            fill: #000000;
        }

        /* --- Footer & Music Player --- */
        .footer-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        .footer {
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            pointer-events: auto;
        }
        
        .footer a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.5);
            animation: textGlow 2s infinite alternate ease-in-out;
            transition: all 0.3s ease;
        }
        .footer a:hover {
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 1), 0 0 30px rgba(255, 255, 255, 0.8), 0 0 50px rgba(255, 255, 255, 0.6);
        }

        @keyframes textGlow {
            0% {
                text-shadow: 0 0 6px rgba(255, 255, 255, 0.6), 0 0 15px rgba(255, 255, 255, 0.3);
            }
            100% {
                text-shadow: 0 0 12px rgba(255, 255, 255, 1), 0 0 25px rgba(255, 255, 255, 0.7), 0 0 40px rgba(255, 255, 255, 0.4);
            }
        }

        .social-buttons {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        .social-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 15, 15, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 10px 16px;
            border-radius: 10px;
            color: #ccc;
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .social-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.5);
        }
        .social-btn svg { width: 16px; height: 16px; fill: currentColor; }

        .music-player {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 280px;
            background: rgba(15, 15, 15, 0.85);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        .player-art {
            width: 48px; height: 48px; border-radius: 8px;
            background-size: cover; background-position: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }
        .player-info { flex-grow: 1; overflow: hidden; }
        .track-title { font-size: 0.75rem; font-weight: 700; margin-bottom: 2px; }
        .track-artist { font-size: 0.6rem; color: #aaa; margin-bottom: 6px; }
        .progress-container { width: 100%; height: 3px; background: rgba(255,255,255,0.15); border-radius: 2px; cursor: pointer; margin-bottom: 6px; }
        .progress-bar { width: 0%; height: 100%; background: #fff; border-radius: 2px; transition: width 0.1s linear; }
        .player-bottom-row { display: flex; align-items: center; justify-content: space-between; }
        .control-btn { background: none; border: none; color: #ccc; cursor: pointer; padding: 2px; display: flex; transition: color 0.2s ease; }
        .control-btn:hover { color: #fff; }
        .volume-container { display: flex; align-items: center; gap: 5px; font-size: 0.6rem; color: #aaa; }
        .volume-slider { width: 50px; height: 3px; accent-color: #fff; cursor: pointer; }
        #youtube-player { display: none; }
    </style>
</head>

    <script>
        const clickSound = document.getElementById('clickSound');
        clickSound.volume = 0.3;
        function playClickEffect() {
            clickSound.currentTime = 0;
            clickSound.play().catch(e => console.log(e));
        }

        window.addEventListener('DOMContentLoaded', () => {
            requestAnimationFrame(() => {
                document.getElementById('siteWrapper').classList.add('loaded');
            });
        });

        let currentIndex = 0;
        const cards = document.querySelectorAll('.leader-card');
        document.getElementById('totalCount').innerText = cards.length;

        function updateCarousel() {
            cards.forEach((card, index) => {
                card.className = 'leader-card';
                let diff = index - currentIndex;

                if (diff > cards.length / 2) diff -= cards.length;
                if (diff < -cards.length / 2) diff += cards.length;

                if (diff === 0) {
                    card.classList.add('active');
                } else if (diff === 1) {
                    card.classList.add('next-1');
                } else if (diff === 2) {
                    card.classList.add('next-2');
                } else if (diff === 3) {
                    card.classList.add('next-3');
                } else if (diff === -1) {
                    card.classList.add('prev-1');
                } else if (diff === -2) {
                    card.classList.add('prev-2');
                } else if (diff === -3) {
                    card.classList.add('prev-3');
                } else {
                    card.classList.add('hidden');
                }
            });
        }

        function selectCard(index, event) {
            if (currentIndex !== index) {
                event.preventDefault();
                playClickEffect();
                currentIndex = index;
                updateCarousel();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                currentIndex = (currentIndex + 1) % cards.length;
                playClickEffect();
                updateCarousel();
            } else if (e.key === 'ArrowLeft') {
                currentIndex = (currentIndex - 1 + cards.length) % cards.length;
                playClickEffect();
                updateCarousel();
            }
        });

        let wheelTimeout = false;
        window.addEventListener('wheel', (e) => {
            if (wheelTimeout) return;
            if (e.deltaY > 0) {
                currentIndex = (currentIndex + 1) % cards.length;
            } else {
                currentIndex = (currentIndex - 1 + cards.length) % cards.length;
            }
            playClickEffect();
            updateCarousel();
            wheelTimeout = true;
            setTimeout(() => { wheelTimeout = false; }, 350);
        }, { passive: true });

        updateCarousel();

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var progressInterval;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0', width: '0',
                videoId: 'OhKAdBRLhwM',
                playerVars: { 'autoplay': 1, 'controls': 0, 'loop': 1, 'playlist': 'OhKAdBRLhwM' },
                events: {
                    'onReady': (e) => { e.target.setVolume(50); e.target.playVideo(); startLoop(); },
                    'onStateChange': (e) => {
                        if(e.data == YT.PlayerState.PLAYING) {
                            document.getElementById('playIcon').style.display = 'none';
                            document.getElementById('pauseIcon').style.display = 'block';
                            startLoop();
                        } else {
                            document.getElementById('playIcon').style.display = 'block';
                            document.getElementById('pauseIcon').style.display = 'none';
                            clearInterval(progressInterval);
                        }
                    }
                }
            });
        }

        document.getElementById('playPauseBtn').addEventListener('click', () => {
            playClickEffect();
            if(!player) return;
            if(player.getPlayerState() === YT.PlayerState.PLAYING) player.pauseVideo();
            else player.playVideo();
        });

        function startLoop() {
            clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if(player && player.getCurrentTime && player.getDuration) {
                    let p = (player.getCurrentTime() / player.getDuration()) * 100;
                    document.getElementById('progressBar').style.width = p + '%';
                }
            }, 100);
        }

        document.getElementById('progressContainer').addEventListener('click', (e) => {
            if(!player || !player.getDuration) return;
            let rect = e.target.getBoundingClientRect();
            player.seekTo(((e.clientX - rect.left) / rect.width) * player.getDuration(), true);
        });

        document.getElementById('volumeSlider').addEventListener('input', (e) => {
            if(player && player.setVolume) player.setVolume(e.target.value);
        });
    </script>
